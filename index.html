function compressImage(file, maxW = 900, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bestSet(sets) {
  return (sets || []).reduce((best, s) => {
    const w = Number(s.weight) || 0, r = Number(s.reps) || 0;
    if (!w && !r) return best;
    if (!best) return { weight: w, reps: r };
    return w > best.weight || (w === best.weight && r > best.reps) ? { weight: w, reps: r } : best;
  }, null);
}
function computeAllPRs(workouts) {
  const best = {};
  Object.entries(workouts).forEach(([date, sess]) => {
    const groups = [
      ...Object.entries(sess.sets || {}).map(([name, sets]) => ({ name, sets })),
      ...(sess.extra || []).map((e) => ({ name: e.name, sets: e.sets || [] })),
    ];
    groups.forEach(({ name, sets }) => {
      const b = bestSet(sets);
      if (!b || !b.weight) return;
      if (!best[name] || b.weight > best[name].weight || (b.weight === best[name].weight && b.reps > best[name].reps)) best[name] = { ...b, date };
    });
  });
  return best;
}

/* ============================ OGGI ============================ */

function Daily({ uid, daily, setDaily, ping, thisWeek, weekDelta, avgMacro }) {
  const [date, setDate] = useState(todayISO());
  const [form, setForm] = useState({});
  useEffect(() => setForm(daily[date] || {}), [date, daily]);
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));
  const macroKcal = form.prot && form.carb && form.fat ? Number(form.prot) * 4 + Number(form.carb) * 4 + Number(form.fat) * 9 : null;

  const save = async () => {
    const row = { user_id: uid, log_date: date, weight: form.weight || null, kcal: form.kcal || null, prot: form.prot || null, carb: form.carb || null, fat: form.fat || null, session: form.session || null, note: form.note || null };
    const { error } = await sb.from("daily_logs").upsert(row, { onConflict: "user_id,log_date" });
    if (error) { ping("Errore: " + error.message); return; }
    setDaily((d) => ({ ...d, [date]: row }));
    ping("Giornata salvata");
  };
  const flag = (val, target, tol) => !val ? null : Number(val) > target + tol ? "+" : Number(val) < target - tol ? "−" : null;

  return <>
    <Eyebrow n="01">Registrazione giornaliera</Eyebrow>
    <Card>
      <Field label="Data" type="date" value={date} onChange={setDate} />
      <Field label="Peso mattutino" unit="kg" step="0.1" value={form.weight} onChange={set("weight")} placeholder="76.4" />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field label="Proteine" unit="g" value={form.prot} onChange={set("prot")} placeholder="110" />
        <Field label="Carboidrati" unit="g" value={form.carb} onChange={set("carb")} placeholder="195" />
        <Field label="Grassi" unit="g" value={form.fat} onChange={set("fat")} placeholder="70" />
        <Field label="Calorie" unit="kcal" value={form.kcal} onChange={set("kcal")} placeholder="1850" />
      </div>
      {macroKcal && <div style={{ fontFamily: MONO, fontSize: 11, color: form.kcal && Math.abs(macroKcal - Number(form.kcal)) > 80 ? C.signal : C.muted, marginTop: -4, marginBottom: 12 }}>
        Dai macro: {Math.round(macroKcal)} kcal{form.kcal && Math.abs(macroKcal - Number(form.kcal)) > 80 ? " — non torna, ricontrolla" : ""}
      </div>}
      <Choice label="Allenamento oggi" options={["A", "B", "C", "Tennis/Padel", "Riposo"]} value={form.session} onChange={set("session")} />
      <TextArea label="Note" rows={2} value={form.note} onChange={set("note")} placeholder="Pasto fuori, dolore, imprevisti…" />
      <Button onClick={save}>Salva giornata</Button>
    </Card>
    <Eyebrow n="02">Lettura corrente</Eyebrow>
    <Card>
      <Readout name="Media peso 7 gg" value={thisWeek ? fmt(thisWeek.avg, 2) : "—"} unit="kg" range={`n=${thisWeek?.n ?? 0}`} />
      <Readout name="Variazione vs sett. prec." value={weekDelta !== null ? (weekDelta > 0 ? "+" : "") + fmt(weekDelta, 2) : "—"} unit="kg" range="−0.15…−0.60"
        flag={weekDelta === null ? null : weekDelta > -TARGET.weeklyLossMin ? "+" : weekDelta < -TARGET.weeklyLossMax ? "−" : null} />
      <Readout name="Media kcal 7 gg" value={fmt(avgMacro("kcal"), 0)} unit="kcal" range={`${TARGET.kcal}`} flag={flag(avgMacro("kcal"), TARGET.kcal, 150)} />
      <Readout name="Media proteine 7 gg" value={fmt(avgMacro("prot"), 0)} unit="g" range={`${TARGET.prot}`} flag={flag(avgMacro("prot"), TARGET.prot, 15)} />
      <Readout name="Media carbo 7 gg" value={fmt(avgMacro("carb"), 0)} unit="g" range={`${TARGET.carb}`} flag={flag(avgMacro("carb"), TARGET.carb, 30)} />
      <Readout name="Media grassi 7 gg" value={fmt(avgMacro("fat"), 0)} unit="g" range={`${TARGET.fat}`} flag={flag(avgMacro("fat"), TARGET.fat, 12)} />
    </Card>
  </>;
}

/* ========================== ALLENAMENTO ========================== */

function ExerciseBlock({ name, targetSets, repsRange, note, rows, onSet, noteVal, onNote, lastText }) {
  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4, gap: 8 }}>
        <span style={{ fontFamily: SANS, fontSize: 14, fontWeight: 700 }}>{name}</span>
        {repsRange && <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted, whiteSpace: "nowrap" }}>target {repsRange}</span>}
      </div>
      {note && <div style={{ fontFamily: SANS, fontSize: 11, color: C.muted, marginBottom: 8 }}>{note}</div>}
      {lastText && <div style={{ fontFamily: MONO, fontSize: 11, color: C.ok, marginBottom: 10 }}>ultima volta: {lastText}</div>}
      <div style={{ display: "grid", gridTemplateColumns: "20px 1fr 1fr", gap: 8, marginBottom: 6 }}>
        <span /><span style={{ fontFamily: MONO, fontSize: 10, color: C.muted }}>KG</span><span style={{ fontFamily: MONO, fontSize: 10, color: C.muted }}>REPS</span>
      </div>
      {Array.from({ length: targetSets }).map((_, idx) => (
        <div key={idx} style={{ display: "grid", gridTemplateColumns: "20px 1fr 1fr", gap: 8, marginBottom: 8, alignItems: "center" }}>
          <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>{idx + 1}</span>
          <input type="number" inputMode="decimal" placeholder="—" value={rows[idx]?.weight ?? ""} onChange={(e) => onSet(idx, "weight", e.target.value)} style={cellInput} />
          <input type="number" inputMode="numeric" placeholder="—" value={rows[idx]?.reps ?? ""} onChange={(e) => onSet(idx, "reps", e.target.value)} style={cellInput} />
        </div>
      ))}
      <TextArea label="Note" rows={2} value={noteVal} onChange={onNote} placeholder="Sensazioni, dolore, tecnica…" />
    </Card>

}

function Allenamento({ uid, workouts, setWorkouts, daily, setDaily, ping }) {
  const [date, setDate] = useState(todayISO());
  const existing = workouts[date];
  const [letter, setLetter] = useState(existing?.letter || "A");
  const [sets, setSets] = useState(existing?.sets || {});
  const [notes, setNotes] = useState(existing?.notes || {});
  const [extra, setExtra] = useState(existing?.extra || []);
  const [newExName, setNewExName] = useState("");

  useEffect(() => {
    const e = workouts[date];
    setLetter(e?.letter || "A"); setSets(e?.sets || {}); setNotes(e?.notes || {}); setExtra(e?.extra || []);
  }, [date]);

  const plan = WORKOUTS[letter];

  const lastTime = (name) => {
    const days = Object.keys(workouts).filter((d) => d < date).sort().reverse();
    for (const d of days) {
      const sess = workouts[d];
      const b = bestSet(sess.sets?.[name]) || bestSet(sess.extra?.find((e) => e.name === name)?.sets);
      if (b && b.weight) return `${b.weight}kg × ${b.reps} (${d})`;
    }
    return null;
  };

  const setPlanSet = (name, idx, field, val) => setSets((s) => { const arr = s[name] ? [...s[name]] : []; arr[idx] = { ...(arr[idx] || {}), [field]: val }; return { ...s, [name]: arr }; });
  const setExtraSet = (exi, idx, field, val) => setExtra((ex) => { const next = [...ex]; const setsArr = next[exi].sets ? [...next[exi].sets] : []; setsArr[idx] = { ...(setsArr[idx] || {}), [field]: val }; next[exi] = { ...next[exi], sets: setsArr }; return next; });
  const addExtraSet = (exi) => setExtra((ex) => { const next = [...ex]; next[exi] = { ...next[exi], sets: [...(next[exi].sets || []), {}] }; return next; });
  const addExtraExercise = () => { if (!newExName.trim()) return; setExtra((ex) => [...ex, { name: newExName.trim(), sets: [{}, {}, {}] }]); setNewExName(""); };

  const save = async () => {
    const row = { user_id: uid, session_date: date, letter, sets, notes, extra };
    const { error } = await sb.from("workout_sessions").upsert(row, { onConflict: "user_id,session_date" });
    if (error) { ping("Errore: " + error.message); return; }
    setWorkouts((w) => ({ ...w, [date]: { letter, sets, notes, extra } }));

    const drow = { user_id: uid, log_date: date, ...(daily[date] || {}), session: letter };
    await sb.from("daily_logs").upsert(drow, { onConflict: "user_id,log_date" });
    setDaily((d) => ({ ...d, [date]: drow }));

    ping("Allenamento salvato");
  };

  return (
    <>
      <Eyebrow n="01b">Log allenamento</Eyebrow>
      <Card>
        <Field label="Data" type="date" value={date} onChange={setDate} />
        <Choice label="Quale scheda" options={["A", "B", "C"]} value={letter} onChange={(v) => setLetter(v || "A")} />
      </Card>
      {plan.ex.map(([name, setsSpec, note]) => (
        <ExerciseBlock key={name} name={name} targetSets={parseTargetSets(setsSpec)} repsRange={parseRepsRange(setsSpec)} note={note}
          rows={sets[name] || []} onSet={(idx, field, val) => setPlanSet(name, idx, field, val)}
          noteVal={notes[name]} onNote={(v) => setNotes((n) => ({ ...n, [name]: v }))} lastText={lastTime(name)} />
      ))}
      {extra.map((ex, exi) => (
        <Card key={exi}>
          <div style={{ fontFamily: SANS, fontSize: 14, fontWeight: 700, marginBottom: 10 }}>{ex.name} <span style={{ fontFamily: MONO, fontSize: 10, color: C.signal }}>· sostituzione</span></div>
          {(ex.sets || []).map((_, idx) => (
            <div key={idx} style={{ display: "grid", gridTemplateColumns: "20px 1fr 1fr", gap: 8, marginBottom: 8, alignItems: "center" }}>
              <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>{idx + 1}</span>
              <input type="number" inputMode="decimal" placeholder="kg" value={ex.sets[idx]?.weight ?? ""} onChange={(e) => setExtraSet(exi, idx, "weight", e.target.value)} style={cellInput} />
              <input type="number" inputMode="numeric" placeholder="reps" value={ex.sets[idx]?.reps ?? ""} onChange={(e) => setExtraSet(exi, idx, "reps", e.target.value)} style={cellInput} />
            </div>
          ))}
          <Button variant="outline" onClick={() => addExtraSet(exi)}>+ serie</Button>
        </Card>
      ))}
      <Card>
        <Field label="Hai sostituito un esercizio?" type="text" value={newExName} onChange={setNewExName} placeholder="Nome dell'esercizio fatto" />
        <Button variant="outline" onClick={addExtraExercise}>Aggiungi esercizio</Button>
      </Card>
      <Card><Button onClick={save}>Salva allenamento</Button></Card>
    </>
  );
}

  return (
    <>
      <Eyebrow n="02b">Storico</Eyebrow>

              <span style={{ fontFamily: MONO, fontSize: 12, fontWeight: 700 }}>{d}</span>

            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, fontFamily: MONO, fontSize: 12 }}>
              <div><div style={{ color: C.muted, fontSize: 10 }}>PESO</div>{e?.weight ? `${e.weight}kg` : "—"}</div>
              <div><div style={{ color: C.muted, fontSize: 10 }}>KCAL</div>{e?.kcal ?? "—"}</div>
              <div><div style={{ color: C.muted, fontSize: 10 }}>PROT</div>{e?.prot ?? "—"}</div>
              <div><div style={{ color: C.muted, fontSize: 10 }}>CARB/FAT</div>{e?.carb ?? "—"}/{e?.fat ?? "—"}</div>
            </div>
          </Card>
        ); }))}

      {view === "settimane" && (weeklies.length === 0 ? <Card><div style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>Nessun check-in ancora.</div></Card> :
        [...weeklies].reverse().map((w, i) => (
          <Card key={i}>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 8 }}>{w.date}</div>
            <div style={{ fontFamily: SANS, fontSize: 13, lineHeight: 1.7 }}>
              {w.avgWeight && <div>Media peso: <b>{fmt(w.avgWeight, 2)} kg</b></div>}
              {w.adherence && <div>Aderenza: {w.adherence}</div>}
              {w.pain && w.pain !== "Nessuno" && <div style={{ color: C.signal }}>Dolore: {w.pain}</div>}
            </div>
          </Card>
        )))}

      {view === "mesi" && (monthlies.length === 0 ? <Card><div style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>Nessuna misura ancora.</div></Card> :
        [...monthlies].reverse().map((m, i) => (
          <Card key={i}>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 8 }}>{m.date}</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, fontFamily: MONO, fontSize: 12 }}>
              {["chest", "waist", "hips", "armL", "armR", "thighL", "thighR"].filter((k) => m[k]).map((k) => (
                <div key={k}><div style={{ color: C.muted, fontSize: 10 }}>{k.toUpperCase()}</div>{m[k]} cm</div>
              ))}

      {view === "cicli" && (cycles.length === 0 ? <Card><div style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>Nessuna review ancora.</div></Card> :
        [...cycles].reverse().map((c, i) => (
          <Card key={i}>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 8 }}>{c.date}</div>

/* =========================== GRAFICI =========================== */

function Charts({ daily, sortedDays, monthlies }) {
  const rows = sortedDays.map((d) => ({ date: d.slice(5), weight: daily[d]?.weight ? Number(daily[d].weight) : null, kcal: daily[d]?.kcal ? Number(daily[d].kcal) : null, prot: daily[d]?.prot ? Number(daily[d].prot) : null }));
  const withMA = rows.map((r, i) => { const win = rows.slice(Math.max(0, i - 6), i + 1).map((x) => x.weight).filter((x) => x !== null); return { ...r, ma: win.length >= 3 ? +(win.reduce((a, b) => a + b, 0) / win.length).toFixed(2) : null }; });
  const axis = { stroke: C.muted, fontSize: 10, fontFamily: MONO };

  if (rows.length < 2) return <><Eyebrow n="02">Grafici</Eyebrow><Card><div style={{ fontFamily: SANS, fontSize: 14, color: C.muted }}>Servono almeno due giorni registrati.</div></Card></>;

  return (
    <>
      <Eyebrow n="02">Grafici</Eyebrow>
      <Card>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 12 }}>PESO · punti e media mobile 7 gg</div>
        <div style={{ height: 220 }}><ResponsiveContainer width="100%" height="100%"><LineChart data={withMA} margin={{ top: 5, right: 8, left: -18, bottom: 0 }}>
          <CartesianGrid stroke={C.wash} vertical={false} /><XAxis dataKey="date" tick={axis} interval="preserveStartEnd" /><YAxis domain={["dataMin - 0.5", "dataMax + 0.5"]} tick={axis} />
          <Tooltip contentStyle={{ fontFamily: MONO, fontSize: 11, border: `1px solid ${C.rule}`, borderRadius: 0 }} />
          <Line type="monotone" dataKey="weight" stroke={C.rule} strokeWidth={1} dot={{ r: 2, fill: C.rule }} connectNulls name="peso" />
          <Line type="monotone" dataKey="ma" stroke={C.ink} strokeWidth={2.2} dot={false} connectNulls name="media 7gg" />
        </LineChart></ResponsiveContainer></div>
      </Card>
      <Card>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 12 }}>CALORIE · target {TARGET.kcal}</div>
        <div style={{ height: 190 }}><ResponsiveContainer width="100%" height="100%"><LineChart data={rows} margin={{ top: 5, right: 8, left: -18, bottom: 0 }}>
          <CartesianGrid stroke={C.wash} vertical={false} /><XAxis dataKey="date" tick={axis} interval="preserveStartEnd" /><YAxis tick={axis} />
          <Tooltip contentStyle={{ fontFamily: MONO, fontSize: 11, border: `1px solid ${C.rule}`, borderRadius: 0 }} /><ReferenceLine y={TARGET.kcal} stroke={C.signal} strokeDasharray="4 4" />
          <Line type="monotone" dataKey="kcal" stroke={C.ink} strokeWidth={1.8} dot={{ r: 2 }} connectNulls name="kcal" />
        </LineChart></ResponsiveContainer></div>
      </Card>
      <Card>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 12 }}>PROTEINE · target {TARGET.prot} g</div>
        <div style={{ height: 190 }}><ResponsiveContainer width="100%" height="100%"><LineChart data={rows} margin={{ top: 5, right: 8, left: -18, bottom: 0 }}>
          <CartesianGrid stroke={C.wash} vertical={false} /><XAxis dataKey="date" tick={axis} interval="preserveStartEnd" /><YAxis tick={axis} />
          <Tooltip contentStyle={{ fontFamily: MONO, fontSize: 11, border: `1px solid ${C.rule}`, borderRadius: 0 }} /><ReferenceLine y={TARGET.prot} stroke={C.signal} strokeDasharray="4 4" />
          <Line type="monotone" dataKey="prot" stroke={C.ok} strokeWidth={1.8} dot={{ r: 2 }} connectNulls name="proteine" />
        </LineChart></ResponsiveContainer></div>
      </Card>
      {monthlies && monthlies.length >= 2 && (
        <Card>
          <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 12 }}>CIRCONFERENZE · vita e torace</div>
          <div style={{ height: 200 }}><ResponsiveContainer width="100%" height="100%"><LineChart data={monthlies.map((m) => ({ date: m.date?.slice(5), waist: m.waist ? Number(m.waist) : null, chest: m.chest ? Number(m.chest) : null }))} margin={{ top: 5, right: 8, left: -18, bottom: 0 }}>
            <CartesianGrid stroke={C.wash} vertical={false} /><XAxis dataKey="date" tick={axis} interval="preserveStartEnd" /><YAxis tick={axis} domain={["dataMin - 2", "dataMax + 2"]} />

            <Line type="monotone" dataKey="waist" stroke={C.signal} strokeWidth={2} dot={{ r: 3 }} connectNulls name="vita" />
            <Line type="monotone" dataKey="chest" stroke={C.ok} strokeWidth={2} dot={{ r: 3 }} connectNulls name="torace" />
          </LineChart></ResponsiveContainer></div>
        </Card>
      )}
    </>
  );
}

/* ========================== SETTIMANA ========================== */

function Weekly({ uid, weeklies, setWeeklies, ping, thisWeek, weekDelta, avgMacro }) {
  const [f, setF] = useState({});
  const set = (k) => (v) => setF((s) => ({ ...s, [k]: v }));
  const tooFast = weekDelta !== null && weekDelta < -TARGET.weeklyLossMax;
  const stalled = weekDelta !== null && weekDelta > -TARGET.weeklyLossMin;
  const painFlag = f.pain && f.pain !== "Nessuno";
  const perfDown = f.perf === "Peggiorata";
  const sleepDown = f.sleep && Number(f.sleep) <= 4;
  const lowAdherence = f.adherence === "Sotto il 70%";

  const save = async () => {
    const data = { ...f, avgWeight: thisWeek?.avg ?? null, delta: weekDelta, avgKcal: avgMacro("kcal"), avgProt: avgMacro("prot") };
    const row = { user_id: uid, week_date: todayISO(), data };
    const { data: inserted, error } = await sb.from("weekly_checkins").insert(row).select().single();
    if (error) { ping("Errore: " + error.message); return; }
    setWeeklies((w) => [...w, { date: inserted.week_date, ...inserted.data }]);
    ping("Check-in salvato"); setF({});
  };

  return <>
    <Eyebrow n="03">Check-in settimanale</Eyebrow>
    <Card style={{ borderLeft: `3px solid ${C.ink}` }}>
      <Readout name="Media peso" value={thisWeek ? fmt(thisWeek.avg, 2) : "—"} unit="kg" range={`n=${thisWeek?.n ?? 0}`} />
      <Readout name="Variazione" value={weekDelta !== null ? (weekDelta > 0 ? "+" : "") + fmt(weekDelta, 2) : "—"} unit="kg" range="−0.15…−0.60" flag={weekDelta === null ? null : tooFast ? "−" : stalled ? "+" : null} />
    </Card>
    <Card>
      <Choice label="Aderenza alla dieta" options={["Sopra il 90%", "70-90%", "Sotto il 70%"]} value={f.adherence} onChange={set("adherence")} />
      <Choice label="Allenamenti completati" options={["3 su 3", "2 su 3", "1 su 3", "0"]} value={f.sessions} onChange={set("sessions")} />

function Monthly({ uid, monthlies, setMonthlies, ping }) {
  const [f, setF] = useState({});
  const [uploading, setUploading] = useState(false);
  const [gallery, setGallery] = useState({});
  const set = (k) => (v) => setF((s) => ({ ...s, [k]: v }));

  const loadGallery = useCallback(async () => {
    const { data, error } = await sb.from("media_files").select("*").eq("user_id", uid).order("entry_date", { ascending: false });
    if (error || !data) return;
    const withUrls = await Promise.all(data.map(async (row) => {
      const { data: signed } = await sb.storage.from("media").createSignedUrl(row.storage_path, 3600);
      return { ...row, url: signed?.signedUrl };
    }));
    const grouped = {};
    withUrls.forEach((r) => { grouped[r.entry_date] = [...(grouped[r.entry_date] || []), r]; });
    setGallery(grouped);
  }, [uid]);

  useEffect(() => { loadGallery(); }, [loadGallery]);

  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setUploading(true);
    const today = todayISO();
    for (const file of files) {
      const blob = await compressImage(file);
      const path = `${uid}/${today}/${Date.now()}_${file.name}.jpg`;
      const { error } = await sb.storage.from("media").upload(path, blob, { contentType: "image/jpeg" });
      if (!error) await sb.from("media_files").insert({ user_id: uid, storage_path: path, file_type: "image/jpeg", related_to: "monthly", entry_date: today });
    }
    setUploading(false);
    ping(`${files.length} foto salvate`);
    await loadGallery();
    e.target.value = "";
  };

  const removePhoto = async (row) => {
    await sb.storage.from("media").remove([row.storage_path]);
    await sb.from("media_files").delete().eq("id", row.id);
    await loadGallery();
  };

  const save = async () => {
    const row = { user_id: uid, month_date: todayISO(), data: f };
    const { data: inserted, error } = await sb.from("monthly_checkins").insert(row).select().single();
    if (error) { ping("Errore: " + error.message); return; }
    setMonthlies((m) => [...m, { date: inserted.month_date, ...inserted.data }]);
    ping("Misure salvate"); setF({});
  };

  const last = monthlies[monthlies.length - 1];
  const cmp = (k) => { const prev = last?.[k] ?? BASE_MEASURE[k]; const now = Number(f[k]); if (!now || !prev) return null; const d = now - prev; return `${d > 0 ? "+" : ""}${d.toFixed(1)}`; };
  const galleryDates = Object.keys(gallery).sort().reverse();

  return (
    <>
      <Eyebrow n="04">Composizione corporea · ogni 4 settimane</Eyebrow>
      <Card>
        <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted, marginBottom: 16 }}>Sempre la mattina a digiuno, muscolo rilassato, stesso punto di misura.</div>
        {[["chest","Torace","all'altezza dei capezzoli"],["waist","Vita","all'ombelico"],["hips","Fianchi","punto più largo"],["armL","Braccio sinistro","a metà"],["armR","Braccio destro","a metà"],["thighL","Coscia sinistra","a metà"],["thighR","Coscia destra","a metà"]].map(([k, label, hint]) => (
          <div key={k}><Field label={`${label} — ${hint}`} unit="cm" step="0.1" value={f[k]} onChange={set(k)} placeholder={String(BASE_MEASURE[k])} />
          {cmp(k) && <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginTop: -10, marginBottom: 12 }}>{cmp(k)} cm dall'ultima misura</div>}</div>
        ))}
      </Card>
      <Card style={{ borderLeft: `3px solid ${C.ink}` }}>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 10 }}>FOTO E VIDEO — private, salvate su Supabase</div>
        <input type="file" accept="image/*" multiple onChange={onFiles} style={{ fontFamily: SANS, fontSize: 13, marginBottom: 10, color: C.ink }} />
        {uploading && <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>caricamento…</div>}
        {galleryDates.map((date) => (
          <div key={date} style={{ marginTop: 14 }}>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 8 }}>{date}</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
              {gallery[date].map((row) => (
                <div key={row.id} style={{ position: "relative" }}>
                  {row.url && <img src={row.url} style={{ width: "100%", aspectRatio: "1", objectFit: "cover", border: `1px solid ${C.rule}` }} />}
                  <button onClick={() => removePhoto(row)} style={{ position: "absolute", top: 2, right: 2, background: C.paper, border: `1px solid ${C.rule}`, color: C.signal, fontSize: 10, width: 18, height: 18, cursor: "pointer", padding: 0 }}>×</button>
                </div>
              ))}
            </div>
          </div>
        ))}
      </Card>
      <Card>
        <Choice label="Allo specchio" options={["Meglio", "Uguale", "Peggio", "Non so dire"]} value={f.mirror} onChange={set("mirror")} />
        <Choice label="Vestiti" options={["Più larghi", "Uguali", "Più stretti"]} value={f.clothes} onChange={set("clothes")} />
        <Scale label="Soddisfazione del mese" value={f.satisfaction} onChange={set("satisfaction")} lo="nulla" hi="massima" />

/* =========================== EXPORT =========================== */

function Exporter({ daily, weeklies, monthlies, workouts, thisWeek, lastWeek, weekDelta, avgMacro, ping }) {
  const [text, setText] = useState("");
  const [kind, setKind] = useState("");

  const workoutWindow = (which) => {
    const back = which === "Settimanale" ? 7 : which === "Mensile" ? 30 : 56;
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - back);
    return Object.keys(workouts || {}).filter((d) => new Date(d) >= cutoff).sort();
  };

  const build = (which) => {
    const L = [];
    L.push(`COACHING REPORT — ${which.toUpperCase()}`, `Data: ${todayISO()}`, "");
    L.push("— PESO —");
    L.push(`Media 7 gg: ${thisWeek ? fmt(thisWeek.avg, 2) + " kg" : "insufficiente"}`);
    L.push(`Variazione: ${weekDelta !== null ? (weekDelta > 0 ? "+" : "") + fmt(weekDelta, 2) + " kg" : "—"}`, "");
    L.push("— NUTRIZIONE (medie 7 gg) —");
    L.push(`Calorie: ${fmt(avgMacro("kcal"), 0)} (target ${TARGET.kcal})`);
    L.push(`Proteine: ${fmt(avgMacro("prot"), 0)} g (target ${TARGET.prot})`, "");

    const wDates = workoutWindow(which);
    if (wDates.length) {
      L.push("— ALLENAMENTI —");
      wDates.forEach((d) => {
        const sess = workouts[d];
        L.push(`${d} · Scheda ${sess.letter}`);
        Object.entries(sess.sets || {}).forEach(([name, sets]) => {
          const done = (sets || []).filter((s) => s.weight || s.reps).map((s) => `${s.weight || "?"}kg×${s.reps || "?"}`).join(", ");
          if (done) L.push(`  ${name}: ${done}`);
        });
      });
      L.push("");
    }
    L.push("— FINE REPORT —");
    return L.join("\n");
  };

  const generate = (which) => { setKind(which); setText(build(which)); };
  const copy = async () => { try { await navigator.clipboard.writeText(text); ping("Copiato"); } catch { ping("Copialo a mano"); } };

  return (
    <>
      <Eyebrow n="08">Esporta</Eyebrow>
      <Card>
        <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted, marginBottom: 16 }}>Genera, copia, incolla in chat.</div>
        <div style={{ display: "grid", gap: 8 }}>
          <Button variant="outline" onClick={() => generate("Settimanale")}>Report settimanale</Button>
          <Button variant="outline" onClick={() => generate("Mensile")}>Report mensile</Button>
          <Button variant="outline" onClick={() => generate("Fine ciclo")}>Report di fine ciclo</Button>
        </div>
      </Card>
      {text && <Card>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 10 }}>{kind.toUpperCase()}</div>
        <textarea readOnly value={text} rows={16} style={{ width: "100%", fontFamily: MONO, fontSize: 12, lineHeight: 1.55, padding: 12, border: `1px solid ${C.rule}`, background: C.paper, color: C.ink, boxSizing: "border-box", resize: "vertical", borderRadius: 0 }} />
        <div style={{ marginTop: 12 }}><Button onClick={copy}>Copia negli appunti</Button></div>
      </Card>}
    </>
  );
}

        {view === "export" && <Exporter {...shared} />}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.rule}`, display: "flex", justifyContent: "space-around", padding: "10px 0 max(10px, env(safe-area-inset-bottom))" }}>
        {[{ key: "home", label: "Home", icon: HomeIcon }, { key: "oggi", label: "Oggi", icon: CalendarDays }, { key: "allenamento", label: "Allen.", icon: Dumbbell }, { key: "coach", label: "Coach", icon: MessagesSquare }].map(({ key, label, icon: Icon }) => {
          const active = view === key;
          return <button key={key} onClick={() => setView(key)} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", color: active ? C.signal : C.muted, padding: "2px 14px" }}>
            <Icon size={19} strokeWidth={active ? 2.25 : 1.75} /><span style={{ fontFamily: SANS, fontSize: 10, fontWeight: active ? 700 : 500 }}>{label}</span>
          </button>;
        })}
      </div>
      {toast && <div style={{ position: "fixed", bottom: 76, left: "50%", transform: "translateX(-50%)", background: C.ink, color: C.card, fontFamily: MONO, fontSize: 12, padding: "11px 18px", zIndex: 50 }}>{toast}</div>}
    </div>
  );
}

function Root() {
  return <AuthGate>{(session) => <App session={session} />}</AuthGate>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;font-family:ui-monospace,monospace;color:#F3F4F6;background:#0B0C0E;min-height:100vh;box-sizing:border-box;">' +
    '<h2 style="color:#FF6259;font-family:-apple-system,sans-serif;">Errore di caricamento</h2>' +
    '<div style="color:#8B909A;font-family:-apple-system,sans-serif;margin-bottom:16px;">Fai uno screenshot di questo messaggio e mandalo in chat.</div>' +
    '<pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;">' +
    (err && err.message ? err.message : String(err)) +
    '</pre></div>';
  console.error(err);
}

</script>
<script>
function runApp() {
  try {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:24px;font-family:ui-monospace,monospace;color:#F3F4F6;background:#0B0C0E;min-height:100vh;box-sizing:border-box;">' +
      '<h2 style="color:#FF6259;font-family:-apple-system,sans-serif;">Errore di compilazione</h2>' +
      '<div style="color:#8B909A;font-family:-apple-system,sans-serif;margin-bottom:16px;">Fai uno screenshot di questo messaggio e mandalo in chat.</div>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;">' +
      (e && e.message ? e.message : String(e)) +
      '</pre></div>';
    console.error(e);
  }
}
if (window.sb) { runApp(); } else { window.addEventListener("sb-ready", runApp, { once: true }); }
</script>
</body>
</html>
