function compressImage(file, maxW = 900, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function AuthGate({ children }) {
  const [session, setSession] = useState(undefined);

  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const pwRef = React.useRef(null);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: MONO, fontSize: 12, color: C.muted }}>caricamento…</div>;
  if (session) return children(session);

  const submit = async () => {
    const email = (emailRef.current?.value || "").trim();
    const pw = pwRef.current?.value || "";
    if (!email || !pw) { setMsg("Inserisci email e password"); return; }
    setBusy(true); setMsg("");
    const { error } = mode === "signin"
      ? await sb.auth.signInWithPassword({ email, password: pw })
      : await sb.auth.signUp({ email, password: pw });
    setBusy(false);
    if (error) setMsg(error.message);
    else if (mode === "signup") setMsg("Account creato. Controlla la mail per confermare, poi accedi.");
  };

function bestSet(sets) {
  return (sets || []).reduce((best, s) => {
    const w = Number(s.weight) || 0, r = Number(s.reps) || 0;
    if (!w && !r) return best;
    if (!best) return { weight: w, reps: r };
    return w > best.weight || (w === best.weight && r > best.reps) ? { weight: w, reps: r } : best;
  }, null);
}
function computeAllPRs(workouts) {
  const best = {};
  Object.entries(workouts).forEach(([date, sess]) => {
    const groups = [
      ...Object.entries(sess.sets || {}).map(([name, sets]) => ({ name, sets })),
      ...(sess.extra || []).map((e) => ({ name: e.name, sets: e.sets || [] })),
    ];
    groups.forEach(({ name, sets }) => {
      const b = bestSet(sets);
      if (!b || !b.weight) return;
      if (!best[name] || b.weight > best[name].weight || (b.weight === best[name].weight && b.reps > best[name].reps)) best[name] = { ...b, date };
    });
  });
  return best;
}

function Allenamento({ uid, workouts, setWorkouts, daily, setDaily, ping, planSwaps, updatePlanSwaps }) {
  const [date, setDate] = useState(todayISO());
  const existing = workouts[date];
  const nextLetter = (d) => {
    const days = Object.keys(workouts).filter((x) => x < d && x >= CYCLE_START).sort();
    const prev = days.length ? workouts[days[days.length - 1]].letter : null;
    return prev === "A" ? "B" : prev === "B" ? "C" : "A";
  };
  const [letter, setLetter] = useState(existing?.letter || nextLetter(date));
  const [sets, setSets] = useState(existing?.sets || {});
  const [notes, setNotes] = useState(existing?.notes || {});
  const [extra, setExtra] = useState(existing?.extra || []);
  const [newExName, setNewExName] = useState("");

  useEffect(() => {
    const e = workouts[date];
    setLetter(e?.letter || nextLetter(date)); setSets(e?.sets || {}); setNotes(e?.notes || {}); setExtra(e?.extra || []);
  }, [date]);

  const plan = WORKOUTS[letter];
  const week = trainWeekOf(workouts, date);
  const sessN = sessionInWeek(workouts, date);
  const sessSwaps = notes.__swaps || {};
  const permSwaps = (planSwaps || {})[letter] || {};
  const resolve = (orig) => {
    if (sessSwaps[orig]) return { name: sessSwaps[orig], from: orig, kind: "oggi" };
    const p = permSwaps[orig];
    if (p && !(hasData(sets[orig]) && !hasData(sets[p]))) return { name: p, from: orig, kind: "sempre" };
    return { name: orig, from: null, kind: null };
  };
  const moveData = (from, to) => {
    if (from === to) return;
    setSets((s) => { if (!s[from]) return s; const n = { ...s, [to]: s[from] }; delete n[from]; return n; });
    setNotes((m) => { if (!m[from]) return m; const n = { ...m, [to]: m[from] }; delete n[from]; return n; });
  };
  const setSessSwap = (orig, val) => setNotes((m) => { const sw = { ...(m.__swaps || {}) }; if (val) sw[orig] = val; else delete sw[orig]; return { ...m, __swaps: sw }; });
  const swapExercise = async (orig, cur, newName, permanent) => {
    moveData(cur, newName);
    if (permanent) {
      setSessSwap(orig, null);
      const next = { ...(planSwaps || {}), [letter]: { ...permSwaps, [orig]: newName } };
      if (newName === orig) delete next[letter][orig];
      const ok = await updatePlanSwaps(next);
      ping(ok ? `Scheda ${letter} aggiornata: ${newName}` : "Errore nel salvare la scheda");
    } else {
      setSessSwap(orig, newName === orig ? null : newName);
    }
  };
  const restoreExercise = async (orig, cur, kind) => {
    moveData(cur, orig);
    if (kind === "oggi") { setSessSwap(orig, null); return; }
    const next = { ...(planSwaps || {}), [letter]: { ...permSwaps } };
    delete next[letter][orig];
    const ok = await updatePlanSwaps(next);
    ping(ok ? `${orig} rimesso nella scheda ${letter}` : "Errore nel salvare la scheda");
  };

  const lastTime = (name, aliases) => {
    const names = [name, ...(aliases || [])];
    const days = Object.keys(workouts).filter((d) => d < date && d >= CYCLE_START).sort().reverse();
    for (const d of days) {
      const sess = workouts[d];
      let b = null;
      for (const nm of names) { b = bestSet(sess.sets?.[nm]) || bestSet(sess.extra?.find((e) => e.name === nm)?.sets); if (b && (b.weight || b.reps)) break; }
      if (b && (b.weight || b.reps)) return `${b.weight}kg × ${b.reps} (${d})`;
    }
    return null;
  };

  const setPlanSet = (name, idx, field, val) => setSets((s) => { const arr = s[name] ? [...s[name]] : []; arr[idx] = { ...(arr[idx] || {}), [field]: val }; return { ...s, [name]: arr }; });
  const setExtraSet = (exi, idx, field, val) => setExtra((ex) => { const next = [...ex]; const setsArr = next[exi].sets ? [...next[exi].sets] : []; setsArr[idx] = { ...(setsArr[idx] || {}), [field]: val }; next[exi] = { ...next[exi], sets: setsArr }; return next; });
  const addExtraSet = (exi) => setExtra((ex) => { const next = [...ex]; next[exi] = { ...next[exi], sets: [...(next[exi].sets || []), {}] }; return next; });
  const addExtraExercise = () => { if (!newExName.trim()) return; setExtra((ex) => [...ex, { name: newExName.trim(), sets: [{}, {}, {}] }]); setNewExName(""); };

  const save = async () => {
    const row = { user_id: uid, session_date: date, letter, sets, notes, extra };
    const { error } = await sb.from("workout_sessions").upsert(row, { onConflict: "user_id,session_date" });
    if (error) { ping("Errore: " + error.message); return; }
    setWorkouts((w) => ({ ...w, [date]: { letter, sets, notes, extra } }));

    const drow = { user_id: uid, log_date: date, ...(daily[date] || {}), session: letter };
    await sb.from("daily_logs").upsert(drow, { onConflict: "user_id,log_date" });
    setDaily((d) => ({ ...d, [date]: drow }));

    ping("Allenamento salvato");
  };

  return (
    <>
      <Eyebrow n="01b">Log allenamento</Eyebrow>
      <Card>
        <Field label="Data" type="date" value={date} onChange={setDate} />
        <Choice label="Quale scheda" options={["A", "B", "C"]} value={letter} onChange={(v) => setLetter(v || "A")} />
      </Card>
      <Card style={{ borderLeft: `3px solid ${C.signal}` }}>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 6, textTransform: "uppercase" }}>Settimana {week} di {CYCLE_WEEKS} · sessione {sessN} di {SESSIONS_PER_WEEK}</div>
        <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.muted, lineHeight: 1.55 }}>
          La settimana avanza ogni 3 allenamenti fatti, non col calendario. Gambe (leg press, hack) sempre RIR 2. Composti upper: serie 1 a RIR 1, le altre a cedimento. Isolamenti: RIR 1-2, ultima anche a cedimento. Segna RIR 0 solo se non riesci a fare un'altra ripetizione pulita. Se la serie 2 ha le stesse ripetizioni della serie 1, la serie 1 non era a cedimento: alza il carico. Progressione: quando fai il massimo delle ripetizioni su tutte le serie, la volta dopo +2,5-5% di carico. Per cambiare un esercizio usa "sostituisci".
        </div>
      </Card>
      {plan.ex.map(([orig, repsRange, kind, nSets, note, aliases]) => {
        const r = resolve(orig); const name = r.name; const ts = setsFor(nSets, week);
        return <ExerciseBlock key={letter + orig + name} name={name} targetSets={ts} repsRange={repsRange} note={r.from ? "" : note} intensity={intensityOf(kind, ts)}
          rows={sets[name] || []} onSet={(idx, field, val) => setPlanSet(name, idx, field, val)}
          noteVal={notes[name]} onNote={(v) => setNotes((n) => ({ ...n, [name]: v }))} lastText={lastTime(name, r.from ? null : aliases)}
          swappedFrom={r.from} swapKind={r.kind}
          onSwap={(newName, permanent) => swapExercise(orig, name, newName, permanent)}
          onRestore={() => restoreExercise(orig, name, r.kind)} />;
      })}
      {extra.map((ex, exi) => (
        <Card key={exi}>
          <div style={{ fontFamily: SANS, fontSize: 14, fontWeight: 700, marginBottom: 10 }}>{ex.name} <span style={{ fontFamily: MONO, fontSize: 10, color: C.signal }}>· extra</span></div>
          {(ex.sets || []).map((_, idx) => (
            <div key={idx} style={{ display: "grid", gridTemplateColumns: "20px 1fr 1fr 1fr", gap: 8, marginBottom: 8, alignItems: "center" }}>
              <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>{idx + 1}</span>
              <input type="number" inputMode="decimal" placeholder="kg" value={ex.sets[idx]?.weight ?? ""} onChange={(e) => setExtraSet(exi, idx, "weight", e.target.value)} style={cellInput} />
              <input type="number" inputMode="numeric" placeholder="reps" value={ex.sets[idx]?.reps ?? ""} onChange={(e) => setExtraSet(exi, idx, "reps", e.target.value)} style={cellInput} />
              <input type="number" inputMode="numeric" placeholder="RIR" value={ex.sets[idx]?.rir ?? ""} onChange={(e) => setExtraSet(exi, idx, "rir", e.target.value)} style={cellInput} />
            </div>
          ))}
          <Button variant="outline" onClick={() => addExtraSet(exi)}>+ serie</Button>
        </Card>
      ))}
      <Card>
        <Field label="Esercizio in più, fuori scheda" type="text" value={newExName} onChange={setNewExName} placeholder="Nome dell'esercizio" />
        <div style={{ fontFamily: SANS, fontSize: 11, color: C.muted, marginTop: -6, marginBottom: 10 }}>Solo per esercizi aggiunti. Per cambiarne uno della scheda usa "sostituisci" sotto quell'esercizio.</div>
        <Button variant="outline" onClick={addExtraExercise}>Aggiungi esercizio extra</Button>
      </Card>
      <Card><Button onClick={save}>Salva allenamento</Button></Card>
    </>
  );
}

function Storico({ sortedDays, daily, weeklies, monthlies, cycles, workouts }) {
  const [view, setView] = useState("giorni");
  const days = [...sortedDays].reverse();
  const prs = useMemo(() => computeAllPRs(workouts || {}), [workouts]);
  const prList = Object.entries(prs).sort((a, b) => a[0].localeCompare(b[0]));

  return (
    <>
      <Eyebrow n="02b">Storico</Eyebrow>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {[["giorni", "Giorni"], ["settimane", "Settimane"], ["mesi", "Mesi"], ["cicli", "Cicli"], ["record", "Record"]].map(([k, label]) => (
          <button key={k} onClick={() => setView(k)}
            style={{ flex: "1 1 auto", fontFamily: SANS, fontSize: 12, fontWeight: 700, padding: "10px 6px", border: `1px solid ${view === k ? C.ink : C.rule}`, background: view === k ? C.ink : C.card, color: view === k ? C.card : C.ink, cursor: "pointer", borderRadius: 0 }}>{label}</button>
        ))}
      </div>

function Weekly({ uid, weeklies, setWeeklies, ping, thisWeek, weekDelta, avgMacro }) {
  const [f, setF] = useState({});
  const set = (k) => (v) => setF((s) => ({ ...s, [k]: v }));
  const phase = phaseOf(weekOf(todayISO()));
  const tooFast = phase.flags && weekDelta !== null && weekDelta < -TARGET.weeklyLossMax;
  const stalled = phase.flags && weekDelta !== null && weekDelta > -TARGET.weeklyLossMin;
  const calibUp = !phase.flags && weekDelta !== null && weekDelta > 0.3;
  const calibDown = !phase.flags && weekDelta !== null && weekDelta < -0.3;
  const painFlag = f.pain && f.pain !== "Nessuno";
  const perfDown = f.perf === "Peggiorata";
  const sleepDown = f.sleep && Number(f.sleep) <= 4;
  const lowAdherence = f.adherence === "Sotto il 70%";

  const save = async () => {
    const data = { ...f, avgWeight: thisWeek?.avg ?? null, delta: weekDelta, avgKcal: avgMacro("kcal"), avgProt: avgMacro("prot") };
    const row = { user_id: uid, week_date: todayISO(), data };
    const { data: inserted, error } = await sb.from("weekly_checkins").insert(row).select().single();
    if (error) { ping("Errore: " + error.message); return; }
    setWeeklies((w) => [...w, { date: inserted.week_date, ...inserted.data }]);
    ping("Check-in salvato"); setF({});
  };

  return <>
    <Eyebrow n="03">Check-in settimanale</Eyebrow>
    <Card style={{ borderLeft: `3px solid ${C.ink}` }}>
      <Readout name="Media peso" value={thisWeek ? fmt(thisWeek.avg, 2) : "—"} unit="kg" range={`n=${thisWeek?.n ?? 0}`} />
      <Readout name="Variazione" value={weekDelta !== null ? (weekDelta > 0 ? "+" : "") + fmt(weekDelta, 2) : "—"} unit="kg" range={phase.range} flag={weekDelta === null ? null : (tooFast || calibDown) ? "−" : (stalled || calibUp) ? "+" : null} />
    </Card>
    <Card>
      <Choice label="Aderenza alla dieta" options={["Sopra il 90%", "70-90%", "Sotto il 70%"]} value={f.adherence} onChange={set("adherence")} />
      <Choice label="Allenamenti completati" options={["3 su 3", "3 + extra", "2 su 3", "1 su 3", "0"]} value={f.sessions} onChange={set("sessions")} />
      <Choice label="Performance in palestra" options={["Migliorata", "Stabile", "Peggiorata"]} value={f.perf} onChange={set("perf")} />
      <Scale label="Fame media" value={f.hunger} onChange={set("hunger")} lo="assente" hi="ingestibile" />
      <Scale label="Energia" value={f.energy} onChange={set("energy")} lo="a terra" hi="ottima" />
      <Scale label="Qualità del sonno" value={f.sleep} onChange={set("sleep")} lo="pessima" hi="ottima" />
      <Scale label="Stress percepito" value={f.stress} onChange={set("stress")} lo="nullo" hi="massimo" />
      <Choice label="Dolore" options={["Nessuno", "Spalla", "Sterno", "Schiena", "Altro"]} value={f.pain} onChange={set("pain")} />
      <Choice label="Passi medi al giorno" options={["Sotto 8k", "8-10k", "Sopra 10k"]} value={f.steps} onChange={set("steps")} />
      <Choice label="RIR rispettato (niente cedimento)" options={["Sì", "Quasi sempre", "No"]} value={f.rirOk} onChange={set("rirOk")} />
      <Choice label="Tennis / padel" options={["No", "1 volta", "2+ volte"]} value={f.sport} onChange={set("sport")} />
    </Card>
    {(calibUp || calibDown) && <Card style={{ borderLeft: `3px solid ${C.signal}` }}><div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 10 }}>CALIBRAZIONE</div><Choice label="Hai pesato tutto in modo preciso?" options={["Sì", "In parte", "No"]} value={f.q_calibPrecision} onChange={set("q_calibPrecision")} /></Card>}
    {tooFast && <Card style={{ borderLeft: `3px solid ${C.signal}` }}><div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 10 }}>CALO RAPIDO</div><Choice label="Hai mangiato meno del previsto?" options={["Sì", "No", "Non so"]} value={f.q_ate_less} onChange={set("q_ate_less")} /></Card>}
    {stalled && <Card style={{ borderLeft: `3px solid ${C.signal}` }}><div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 10 }}>PESO FERMO</div><Choice label="Pesatura precisa?" options={["Tutto pesato", "Stimato in parte", "Molto stimato"]} value={f.q_precision} onChange={set("q_precision")} /></Card>}
    {perfDown && <Card style={{ borderLeft: `3px solid ${C.signal}` }}><div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 10 }}>PERFORMANCE</div><TextArea label="Su quali esercizi?" rows={2} value={f.q_whichLifts} onChange={set("q_whichLifts")} /></Card>}
    {sleepDown && <Card style={{ borderLeft: `3px solid ${C.signal}` }}><div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 10 }}>SONNO</div><Choice label="Allenamenti dopo le 20:00?" options={["Sì", "No"]} value={f.q_lateTraining} onChange={set("q_lateTraining")} /></Card>}

    <Card>
      <TextArea label="Qualcosa che dovrei sapere" rows={4} value={f.notes} onChange={set("notes")} />
      <Button onClick={save}>Salva check-in</Button>
    </Card>
  </>;
}

function Monthly({ uid, monthlies, setMonthlies, ping }) {
  const [f, setF] = useState({});
  const [uploading, setUploading] = useState(false);
  const [gallery, setGallery] = useState({});
  const set = (k) => (v) => setF((s) => ({ ...s, [k]: v }));

  const loadGallery = useCallback(async () => {
    const { data, error } = await sb.from("media_files").select("*").eq("user_id", uid).order("entry_date", { ascending: false });
    if (error || !data) return;
    const withUrls = await Promise.all(data.map(async (row) => {
      const { data: signed } = await sb.storage.from("media").createSignedUrl(row.storage_path, 3600);
      return { ...row, url: signed?.signedUrl };
    }));
    const grouped = {};
    withUrls.forEach((r) => { grouped[r.entry_date] = [...(grouped[r.entry_date] || []), r]; });
    setGallery(grouped);
  }, [uid]);

  useEffect(() => { loadGallery(); }, [loadGallery]);

  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setUploading(true);
    const today = todayISO();
    for (const file of files) {
      const blob = await compressImage(file);
      const path = `${uid}/${today}/${Date.now()}_${file.name}.jpg`;
      const { error } = await sb.storage.from("media").upload(path, blob, { contentType: "image/jpeg" });
      if (!error) await sb.from("media_files").insert({ user_id: uid, storage_path: path, file_type: "image/jpeg", related_to: "monthly", entry_date: today });
    }
    setUploading(false);
    ping(`${files.length} foto salvate`);
    await loadGallery();
    e.target.value = "";
  };

  const removePhoto = async (row) => {
    await sb.storage.from("media").remove([row.storage_path]);
    await sb.from("media_files").delete().eq("id", row.id);
    await loadGallery();
  };

  const save = async () => {
    const row = { user_id: uid, month_date: todayISO(), data: f };
    const { data: inserted, error } = await sb.from("monthly_checkins").insert(row).select().single();
    if (error) { ping("Errore: " + error.message); return; }
    setMonthlies((m) => [...m, { date: inserted.month_date, ...inserted.data }]);
    ping("Misure salvate"); setF({});
  };

  const measureOpen = weekOf(todayISO()) >= MEASURE_FROM_WEEK;
  const cycleMonthlies = monthlies.filter((m) => m.date >= CYCLE_START && (m.waist || m.chest));
  const last = cycleMonthlies[cycleMonthlies.length - 1];
  const cmp = (k) => { const prev = last?.[k]; const now = Number(f[k]); if (!now || !prev) return null; const d = now - prev; return `${d > 0 ? "+" : ""}${d.toFixed(1)}`; };
  const galleryDates = Object.keys(gallery).sort().reverse();

  return (
    <>
      <Eyebrow n="04">Composizione corporea · ogni 4 settimane</Eyebrow>
      {!measureOpen && <Card style={{ borderLeft: `3px solid ${C.signal}` }}>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 8 }}>CIRCONFERENZE RIMANDATE</div>
        <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted, lineHeight: 1.55 }}>Si misura dalla settimana {MEASURE_FROM_WEEK} (dal 24 novembre). Quella sarà la nuova misura di partenza, senza confronti con agosto. Le foto invece puoi caricarle già ora.</div>
      </Card>}
      {measureOpen && <Card>
        <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted, marginBottom: 16 }}>Sempre la mattina a digiuno, muscolo rilassato, stesso punto di misura.</div>
        {[["chest","Torace","all'altezza dei capezzoli"],["waist","Vita","all'ombelico"],["hips","Fianchi","punto più largo"],["armL","Braccio sinistro","a metà"],["armR","Braccio destro","a metà"],["thighL","Coscia sinistra","a metà"],["thighR","Coscia destra","a metà"]].map(([k, label, hint]) => (
          <div key={k}><Field label={`${label} — ${hint}`} unit="cm" step="0.1" value={f[k]} onChange={set(k)} placeholder="cm" />
          {cmp(k) && <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginTop: -10, marginBottom: 12 }}>{cmp(k)} cm dall'ultima misura</div>}</div>
        ))}
      </Card>}
      <Card style={{ borderLeft: `3px solid ${C.ink}` }}>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 10 }}>FOTO E VIDEO — private, salvate su Supabase</div>
        <input type="file" accept="image/*" multiple onChange={onFiles} style={{ fontFamily: SANS, fontSize: 13, marginBottom: 10, color: C.ink }} />
        {uploading && <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>caricamento…</div>}
        {galleryDates.map((date) => (
          <div key={date} style={{ marginTop: 14 }}>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 8 }}>{date}</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
              {gallery[date].map((row) => (
                <div key={row.id} style={{ position: "relative" }}>
                  {row.url && <img src={row.url} style={{ width: "100%", aspectRatio: "1", objectFit: "cover", border: `1px solid ${C.rule}` }} />}
                  <button onClick={() => removePhoto(row)} style={{ position: "absolute", top: 2, right: 2, background: C.paper, border: `1px solid ${C.rule}`, color: C.signal, fontSize: 10, width: 18, height: 18, cursor: "pointer", padding: 0 }}>×</button>
                </div>
              ))}
            </div>
          </div>
        ))}
      </Card>
      {measureOpen && <Card>
        <Choice label="Allo specchio" options={["Meglio", "Uguale", "Peggio", "Non so dire"]} value={f.mirror} onChange={set("mirror")} />
        <Choice label="Vestiti" options={["Più larghi", "Uguali", "Più stretti"]} value={f.clothes} onChange={set("clothes")} />
        <Scale label="Soddisfazione del mese" value={f.satisfaction} onChange={set("satisfaction")} lo="nulla" hi="massima" />
        <TextArea label="Cambiamenti rilevanti" rows={4} value={f.changes} onChange={set("changes")} />
        <Button onClick={save}>Salva misure del mese</Button>
      </Card>}
    </>
  );
}

      <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 6, textTransform: "uppercase" }}>Allenamento · settimana {week} di {CYCLE_WEEKS} · prossima sessione {sessN}/{SESSIONS_PER_WEEK}</div>
      <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 8 }}>CALENDARIO SETT. {weekOf(todayISO())} · DIETA: {phaseOf().name.toUpperCase()}</div>
      <div style={{ fontFamily: SANS, fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
        Start {CYCLE_START}. La settimana di allenamento avanza ogni 3 sessioni fatte. Gambe RIR 2; composti upper serie 1 a RIR 1 e il resto a cedimento; isolamenti RIR 1-2 con ultima serie anche a cedimento. Proteine minimo 110 g ogni giorno. Creatina 3-5 g ogni giorno. Circa 8000 passi al giorno. Deficit deciso dal coach dopo la calibrazione. Circonferenze dalla sett. {MEASURE_FROM_WEEK} di calendario. Checkpoint sett. 6 e 12.
      </div>
    </Card>
    <Card>
      <Readout name="Calorie" value={TARGET.kcal} unit="kcal" range="ogni giorno" />
      <Readout name="Proteine" value={TARGET.prot} unit="g" range="" />
      <Readout name="Carboidrati" value={TARGET.carb} unit="g" range="" />
      <Readout name="Grassi" value={TARGET.fat} unit="g" range="" />
    </Card>
    <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
      {["A", "B", "C"].map((k) => <button key={k} onClick={() => setOpen(k)} style={{ flex: 1, fontFamily: SANS, fontSize: 13, fontWeight: 700, padding: "12px 0", border: `1px solid ${open === k ? C.ink : C.rule}`, background: open === k ? C.ink : C.card, color: open === k ? C.card : C.ink, cursor: "pointer", borderRadius: 0 }}>{k}</button>)}
    </div>
    <Card>
      <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginBottom: 14, textTransform: "uppercase" }}>{WORKOUTS[open].name}</div>
      {WORKOUTS[open].ex.map(([orig, reps, kind, nSets, note], i) => {
        const name = effectiveName(orig, open, planSwaps);
        return <div key={i} style={{ padding: "11px 0", borderBottom: `1px solid ${C.wash}` }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 12 }}>
            <span style={{ fontFamily: SANS, fontSize: 14, fontWeight: 600 }}>{name}</span>
            <span style={{ fontFamily: MONO, fontSize: 13, whiteSpace: "nowrap" }}>{setsFor(nSets, week)} × {reps}</span>
          </div>
          {name !== orig ? <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, marginTop: 3 }}>al posto di {orig}</div>
            : note && <div style={{ fontFamily: SANS, fontSize: 12, color: C.muted, marginTop: 3 }}>{note}</div>}
        </div>;
      })}
    </Card>
  </>;
}

/* ============================ COACH ============================ */

function Coach({ coachNotes: allNotes }) {
  const coachNotes = allNotes.filter((n) => n.kind !== "plan_swaps");
  return <>
    <Eyebrow n="07">Le mie valutazioni</Eyebrow>
    {coachNotes.length === 0 ? <Card><div style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>Ancora nessuna.</div></Card> :
      coachNotes.map((n, i) => (
        <Card key={i}>
          <div style={{ fontFamily: MONO, fontSize: 11, color: C.signal, textTransform: "uppercase", marginBottom: 10 }}>{n.kind} · {n.note_date}</div>
          <div style={{ fontFamily: SANS, fontSize: 13.5, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{n.content}</div>
        </Card>
      ))}
  </>;
}

/* =========================== EXPORT =========================== */

function Exporter({ daily, weeklies, monthlies, workouts, thisWeek, lastWeek, weekDelta, avgMacro, ping, planSwaps }) {
  const [text, setText] = useState("");
  const [kind, setKind] = useState("");

  const workoutWindow = (which) => {
    const back = which === "Settimanale" ? 7 : which === "Mensile" ? 30 : 56;
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - back);
    return Object.keys(workouts || {}).filter((d) => new Date(d) >= cutoff).sort();
  };

  const build = (which) => {
    const L = [];
    L.push(`COACHING REPORT — ${which.toUpperCase()}`, `Data: ${todayISO()}`, `${CYCLE_LABEL} · allenamento sett. ${trainWeekOf(workouts, NEXT_DAY)}/${CYCLE_WEEKS} (${cycleSessionsBefore(workouts, NEXT_DAY)} sessioni fatte) · calendario sett. ${weekOf(todayISO())} · dieta: ${phaseOf().name}`);
    const permLines = Object.entries(planSwaps || {}).flatMap(([lt, m]) => Object.entries(m || {}).map(([o, n]) => `  ${lt}: ${o} → ${n}`));
    if (permLines.length) L.push("Sostituzioni fisse in scheda:", ...permLines);
    L.push("");
    L.push("— PESO —");
    L.push(`Media 7 gg: ${thisWeek ? fmt(thisWeek.avg, 2) + " kg" : "insufficiente"}`);
    L.push(`Variazione: ${weekDelta !== null ? (weekDelta > 0 ? "+" : "") + fmt(weekDelta, 2) + " kg" : "—"}`, "");
    L.push("— NUTRIZIONE (medie 7 gg) —");
    L.push(`Calorie: ${fmt(avgMacro("kcal"), 0)} (target ${TARGET.kcal})`);
    L.push(`Proteine: ${fmt(avgMacro("prot"), 0)} g (target ${TARGET.prot})`, "");

    const dDates = Object.keys(daily || {}).filter((d) => { const c = new Date(); c.setDate(c.getDate() - (which === "Settimanale" ? 7 : which === "Mensile" ? 30 : 84)); return new Date(d) >= c; }).sort();
    if (dDates.length) {
      L.push("— GIORNI (data · peso · kcal · P/C/G · sessione) —");
      dDates.forEach((d) => { const x = daily[d] || {}; L.push(`${d} · ${x.weight ?? "-"} · ${x.kcal ?? "-"} · ${x.prot ?? "-"}/${x.carb ?? "-"}/${x.fat ?? "-"} · ${x.session || "-"}${x.note ? " · " + x.note : ""}`); });
      L.push("");
    }
    const wDates = workoutWindow(which);
    if (wDates.length) {
      L.push("— ALLENAMENTI —");
      wDates.forEach((d) => {
        const sess = workouts[d];
        L.push(`${d} · Scheda ${sess.letter} · sett. ${d >= CYCLE_START ? trainWeekOf(workouts, d) : "-"}`);
        Object.entries((sess.notes || {}).__swaps || {}).forEach(([o, n]) => L.push(`  solo oggi: ${o} → ${n}`));
        Object.entries(sess.notes || {}).forEach(([name, n]) => { if (n && !name.startsWith("__")) L.push(`  nota ${name}: ${n}`); });
        (sess.extra || []).forEach((ex) => { const d2 = (ex.sets || []).filter((s) => s.weight || s.reps).map((s) => `${s.weight || "?"}kg×${s.reps || "?"}${s.rir ? "@" + s.rir : ""}`).join(", "); if (d2) L.push(`  EXTRA ${ex.name}: ${d2}`); });
        Object.entries(sess.sets || {}).forEach(([name, sets]) => {
          const done = (sets || []).filter((s) => s.weight || s.reps).map((s) => `${s.weight || "?"}kg×${s.reps || "?"}${s.rir !== undefined && s.rir !== "" ? "@" + s.rir : ""}`).join(", ");
          if (done) L.push(`  ${name}: ${done}`);
        });
      });
      L.push("");
    }
    L.push("— FINE REPORT —");
    return L.join("\n");
  };

  const generate = (which) => { setKind(which); setText(build(which)); };
  const copy = async () => { try { await navigator.clipboard.writeText(text); ping("Copiato"); } catch { ping("Copialo a mano"); } };

  return (
    <>
      <Eyebrow n="08">Esporta</Eyebrow>
      <Card>
        <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted, marginBottom: 16 }}>Genera, copia, incolla in chat.</div>
        <div style={{ display: "grid", gap: 8 }}>
          <Button variant="outline" onClick={() => generate("Settimanale")}>Report settimanale</Button>
          <Button variant="outline" onClick={() => generate("Mensile")}>Report mensile</Button>
          <Button variant="outline" onClick={() => generate("Fine ciclo")}>Report di fine ciclo</Button>
        </div>
      </Card>
      {text && <Card>
        <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted, marginBottom: 10 }}>{kind.toUpperCase()}</div>
        <textarea readOnly value={text} rows={16} style={{ width: "100%", fontFamily: MONO, fontSize: 12, lineHeight: 1.55, padding: 12, border: `1px solid ${C.rule}`, background: C.paper, color: C.ink, boxSizing: "border-box", resize: "vertical", borderRadius: 0 }} />
        <div style={{ marginTop: 12 }}><Button onClick={copy}>Copia negli appunti</Button></div>
      </Card>}
    </>
  );
}

/* ============================ APP ============================ */

function App({ session }) {
  const uid = session.user.id;
  const [view, setView] = useState("home");
  const [ready, setReady] = useState(false);
  const [toast, setToast] = useState("");
  const [themeName, setThemeName] = useState("dark");
  const [daily, setDaily] = useState({});
  const [weeklies, setWeeklies] = useState([]);
  const [monthlies, setMonthlies] = useState([]);
  const [cycles, setCycles] = useState([]);
  const [coachNotes, setCoachNotes] = useState([]);
  const [workouts, setWorkouts] = useState({});
  const [planSwaps, setPlanSwaps] = useState({});

  const ping = useCallback((m) => { setToast(m); setTimeout(() => setToast(""), 2400); }, []);
  const toggleTheme = () => { const next = themeName === "dark" ? "light" : "dark"; C = PALETTES[next]; setThemeName(next); localStorage.setItem("theme-pref", next); };

  const loadAll = useCallback(async () => {
    const [d, w, m, c, cn, wk] = await Promise.all([
      sb.from("daily_logs").select("*").eq("user_id", uid).order("log_date"),
      sb.from("weekly_checkins").select("*").eq("user_id", uid).order("week_date"),
      sb.from("monthly_checkins").select("*").eq("user_id", uid).order("month_date"),
      sb.from("cycle_reviews").select("*").eq("user_id", uid).order("cycle_date"),
      sb.from("coach_notes").select("*").eq("user_id", uid).order("note_date", { ascending: false }),
      sb.from("workout_sessions").select("*").eq("user_id", uid).order("session_date"),
    ]);
    const dmap = {}; (d.data || []).forEach((r) => { dmap[r.log_date] = r; });
    setDaily(dmap);
    setWeeklies((w.data || []).map((r) => ({ date: r.week_date, ...r.data })));
    setMonthlies((m.data || []).map((r) => ({ date: r.month_date, ...r.data })));
    setCycles((c.data || []).map((r) => ({ date: r.cycle_date, ...r.data })));
    setCoachNotes(cn.data || []);
    const swapRows = (cn.data || []).filter((r) => r.kind === "plan_swaps").sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
    if (swapRows.length) { try { setPlanSwaps(JSON.parse(swapRows[0].content) || {}); } catch (e) {} }
    const wmap = {}; (wk.data || []).forEach((r) => { wmap[r.session_date] = { letter: r.letter, sets: r.sets, notes: r.notes, extra: r.extra }; });
    setWorkouts(wmap);
    const savedTheme = localStorage.getItem("theme-pref") || "dark";
    C = PALETTES[savedTheme]; setThemeName(savedTheme);
    setReady(true);
  }, [uid]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const sortedDays = Object.keys(daily).sort();
  const weeklyAvg = (weeksBack = 0) => {
    const end = new Date(todayISO()); end.setDate(end.getDate() - weeksBack * 7);
    const start = new Date(end); start.setDate(start.getDate() - 6);
    const vals = sortedDays.filter((k) => { const dt = new Date(k); return dt >= start && dt <= end && daily[k]?.weight; }).map((k) => Number(daily[k].weight));
    return vals.length ? { avg: vals.reduce((a, b) => a + b, 0) / vals.length, n: vals.length } : null;
  };
  const thisWeek = weeklyAvg(0);
  const lastWeek = weeklyAvg(1);
  const weekDelta = thisWeek && lastWeek ? thisWeek.avg - lastWeek.avg : null;
  const avgMacro = (field, days = 7) => {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (days - 1));
    const vals = sortedDays.filter((k) => new Date(k) >= cutoff && daily[k]?.[field]).map((k) => Number(daily[k][field]));
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };

  const updatePlanSwaps = async (next) => {
    const { error } = await sb.from("coach_notes").insert({ user_id: uid, kind: "plan_swaps", note_date: todayISO(), content: JSON.stringify(next) });
    if (error) return false;
    setPlanSwaps(next);
    return true;
  };

  if (!ready) return <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: MONO, fontSize: 12, color: C.muted }}>caricamento dati…</div>;

  const shared = { uid, daily, setDaily, weeklies, setWeeklies, monthlies, setMonthlies, cycles, setCycles, coachNotes, workouts, setWorkouts, planSwaps, updatePlanSwaps, ping, thisWeek, lastWeek, weekDelta, avgMacro, sortedDays };
  const todayEntry = daily[todayISO()];
  const todayWorkout = workouts[todayISO()];
  const preview = {
    oggi: todayEntry?.weight ? `${todayEntry.weight} kg oggi` : "Non ancora oggi",
    allenamento: todayWorkout ? `oggi: scheda ${todayWorkout.letter}` : `${Object.keys(workouts).length} sessioni`,
    storico: `${sortedDays.length} giorni`,
    grafici: thisWeek ? `media ${fmt(thisWeek.avg, 1)} kg` : "poco storico",
    settimana: weeklies.length ? `ultimo ${weeklies[weeklies.length - 1].date}` : "nessuno ancora",
    mese: weekOf(todayISO()) < MEASURE_FROM_WEEK ? "misure da sett. 4" : (monthlies.length ? `ultimo ${monthlies[monthlies.length - 1].date}` : "nessuno ancora"),
    ciclo: `${cycles.length} chiusi`,
    piano: `${CYCLE_LABEL} · sett. ${trainWeekOf(workouts, NEXT_DAY)}/${CYCLE_WEEKS}`,
    coach: `${coachNotes.filter((n) => n.kind !== "plan_swaps").length} valutazioni`,
    export: "genera report",
    guida: "come funziona",
  };
  const current = SECTIONS.find((s) => s.key === view);

  return (
    <div style={{ minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: SANS, paddingBottom: 90 }}>
      <div style={{ borderBottom: `1px solid ${C.rule}`, background: C.card, padding: "14px 16px" }}>
        {view === "home" ? (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <h1 style={{ margin: 0, fontSize: 18, fontWeight: 800 }}>Athlete Log</h1>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontFamily: MONO, fontSize: 10, color: C.muted }}>{sortedDays.length} GG</span>
                <button onClick={toggleTheme} style={{ border: `1px solid ${C.rule}`, background: "none", borderRadius: 999, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.ink }}>{themeName === "dark" ? <Sun size={14} /> : <Moon size={14} />}</button>
                <button onClick={() => sb.auth.signOut()} style={{ border: `1px solid ${C.rule}`, background: "none", borderRadius: 999, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.ink }}><LogOut size={13} /></button>
              </div>
            </div>
            <div style={{ fontFamily: MONO, fontSize: 10, color: C.muted, marginTop: 3 }}>MATTHEW · 172 CM · TARGET {TARGET.kcal} KCAL</div>
          </>
        ) : (
          <button onClick={() => setView("home")} style={{ display: "flex", alignItems: "center", gap: 6, border: "none", background: "none", color: C.ink, cursor: "pointer", padding: 0 }}>
            <ChevronLeft size={18} /><span style={{ fontFamily: SANS, fontSize: 15, fontWeight: 700 }}>{current?.label}</span>
          </button>
        )}
      </div>

      <div style={{ padding: 16, maxWidth: 680, margin: "0 auto" }}>
        {view === "home" && <Home go={setView} preview={preview} />}
        {view === "guida" && <Guida go={setView} />}
        {view === "oggi" && <Daily {...shared} />}
        {view === "allenamento" && <Allenamento {...shared} />}
        {view === "storico" && <Storico {...shared} />}
        {view === "grafici" && <Charts {...shared} />}
        {view === "settimana" && <Weekly {...shared} />}
        {view === "mese" && <Monthly {...shared} />}
        {view === "ciclo" && <Cycle {...shared} />}
        {view === "piano" && <Piano {...shared} />}
        {view === "coach" && <Coach {...shared} />}
        {view === "export" && <Exporter {...shared} />}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.rule}`, display: "flex", justifyContent: "space-around", padding: "10px 0 max(10px, env(safe-area-inset-bottom))" }}>
        {[{ key: "home", label: "Home", icon: HomeIcon }, { key: "oggi", label: "Oggi", icon: CalendarDays }, { key: "allenamento", label: "Allen.", icon: Dumbbell }, { key: "coach", label: "Coach", icon: MessagesSquare }].map(({ key, label, icon: Icon }) => {
          const active = view === key;
          return <button key={key} onClick={() => setView(key)} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", color: active ? C.signal : C.muted, padding: "2px 14px" }}>
            <Icon size={19} strokeWidth={active ? 2.25 : 1.75} /><span style={{ fontFamily: SANS, fontSize: 10, fontWeight: active ? 700 : 500 }}>{label}</span>
          </button>;
        })}
      </div>
      {toast && <div style={{ position: "fixed", bottom: 76, left: "50%", transform: "translateX(-50%)", background: C.ink, color: C.card, fontFamily: MONO, fontSize: 12, padding: "11px 18px", zIndex: 50 }}>{toast}</div>}
    </div>
  );
}

function Root() {
  return <AuthGate>{(session) => <App session={session} />}</AuthGate>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;font-family:ui-monospace,monospace;color:#F3F4F6;background:#0B0C0E;min-height:100vh;box-sizing:border-box;">' +
    '<h2 style="color:#FF6259;font-family:-apple-system,sans-serif;">Errore di caricamento</h2>' +
    '<div style="color:#8B909A;font-family:-apple-system,sans-serif;margin-bottom:16px;">Fai uno screenshot di questo messaggio e mandalo in chat.</div>' +
    '<pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;">' +
    (err && err.message ? err.message : String(err)) +
    '</pre></div>';
  console.error(err);
}

</script>
<script>
function runApp() {
  try {
    var src = document.getElementById("app-source").textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div style="padding:24px;font-family:ui-monospace,monospace;color:#F3F4F6;background:#0B0C0E;min-height:100vh;box-sizing:border-box;">' +
      '<h2 style="color:#FF6259;font-family:-apple-system,sans-serif;">Errore di compilazione</h2>' +
      '<div style="color:#8B909A;font-family:-apple-system,sans-serif;margin-bottom:16px;">Fai uno screenshot di questo messaggio e mandalo in chat.</div>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;">' +
      (e && e.message ? e.message : String(e)) +
      '</pre></div>';
    console.error(e);
  }
}
if (window.sb) { runApp(); } else { window.addEventListener("sb-ready", runApp, { once: true }); }
</script>
